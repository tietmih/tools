name: CI

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - "dist/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - "dist/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  discover:
    name: discover tools
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      linux: ${{ steps.list.outputs.linux }}
      arm64: ${{ steps.list.outputs.arm64 }}
      windows: ${{ steps.list.outputs.windows }}
      runtime: ${{ steps.list.outputs.runtime }}
      msvc: ${{ steps.list.outputs.msvc }}
      coverage: ${{ steps.list.outputs.coverage }}
      has_runtime: ${{ steps.list.outputs.has_runtime }}
      has_msvc: ${{ steps.list.outputs.has_msvc }}
      has_coverage: ${{ steps.list.outputs.has_coverage }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: list
        run: |
          jq -c '[.tools[] | select(.linux)] | if length == 0 then [{"name":"(none)"}] else . end' .github/tools.json > "$RUNNER_TEMP/linux.json"
          jq -c '[.tools[] | select(.arm64)] | if length == 0 then [{"name":"(none)"}] else . end' .github/tools.json > "$RUNNER_TEMP/arm64.json"
          jq -c '[.tools[] | select(.windows)] | if length == 0 then [{"name":"(none)"}] else . end' .github/tools.json > "$RUNNER_TEMP/windows.json"
          jq -c '[.tools[] | select(.runtime) | .name] | map([{name: ., os: "windows-2022"}, {name: ., os: "windows-2025"}]) | add // [] | if length == 0 then [{"name":"(none)","os":"windows-2022"}] else . end' .github/tools.json > "$RUNNER_TEMP/runtime.json"
          jq -c '[.tools[] | select(.msvc) | .name] | map([{name: ., os: "windows-2022"}, {name: ., os: "windows-2025"}]) | add // [] | if length == 0 then [{"name":"(none)","os":"windows-2022"}] else . end' .github/tools.json > "$RUNNER_TEMP/msvc.json"
          jq -c '[.tools[] | select(.coverage)] | if length == 0 then [{"name":"(none)"}] else . end' .github/tools.json > "$RUNNER_TEMP/coverage.json"
          for name in linux arm64 windows runtime msvc coverage; do
            echo "$name=$(cat "$RUNNER_TEMP/$name.json")" >> "$GITHUB_OUTPUT"
          done
          for name in runtime msvc coverage; do
            if jq -e 'length > 0 and (.[0].name != "(none)")' "$RUNNER_TEMP/$name.json" >/dev/null; then
              echo "has_$name=true" >> "$GITHUB_OUTPUT"
            else
              echo "has_$name=false" >> "$GITHUB_OUTPUT"
            fi
          done

  deps:
    name: ${{ matrix.name }}
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.linux) }}
    uses: ./.github/workflows/_deps.yml
    with:
      tool: ${{ matrix.name }}
      build_host: true
      build_windows: ${{ matrix.windows }}

  linux:
    name: ${{ matrix.name }}
    needs: [discover, deps]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.linux) }}
    uses: ./.github/workflows/_test-linux.yml
    with:
      tool: ${{ matrix.name }}
      runner: ubuntu-24.04
      artifact_suffix: x64
      upload_vectors: true
      needs_deps: true

  arm64:
    name: ${{ matrix.name }}
    needs: [discover, deps]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.arm64) }}
    uses: ./.github/workflows/_test-linux.yml
    with:
      tool: ${{ matrix.name }}
      runner: ubuntu-24.04-arm
      artifact_suffix: arm64
      upload_vectors: false
      needs_deps: true

  windows:
    name: ${{ matrix.name }}
    needs: [discover, deps]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.windows) }}
    uses: ./.github/workflows/_build-windows.yml
    with:
      tool: ${{ matrix.name }}
      needs_deps: true

  windows-runtime:
    name: ${{ matrix.name }} / windows runtime (${{ matrix.os }})
    needs: [discover, linux, windows]
    if: needs.discover.outputs.has_runtime == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.runtime) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ matrix.name }}-windows
          path: payload
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ matrix.name }}-vectors-x64
          path: vectors
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ matrix.name }}-installer
          path: installer
      - name: Native Windows smoke test
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./${{ matrix.name }}/ci/windows-smoke.ps1 `
            -Payload "$env:GITHUB_WORKSPACE\payload" `
            -Vectors "$env:GITHUB_WORKSPACE\vectors" `
            -Installer "$env:GITHUB_WORKSPACE\installer"

  msvc:
    name: ${{ matrix.name }} / msvc (${{ matrix.os }})
    needs: discover
    if: needs.discover.outputs.has_msvc == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.msvc) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build with MSVC and run unit tests
        shell: pwsh
        run: ./${{ matrix.name }}/ci/msvc.ps1

  coverage:
    name: ${{ matrix.name }} / coverage
    needs: [discover, deps]
    if: needs.discover.outputs.has_coverage == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.coverage) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg gcovr nasm
      - name: Download host FFmpeg artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ matrix.name }}-ffmpeg-host-x64
          path: ${{ matrix.name }}/build-deps/ffmpeg-host
      - name: Make artifact binaries executable
        run: chmod +x "${{ matrix.name }}"/build-deps/ffmpeg-host/bin/* 2>/dev/null || true
      - name: Collect coverage
        run: bash "${{ matrix.name }}/ci/coverage.sh"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.name }}-coverage
          path: ${{ matrix.name }}/build-deps/coverage
          if-no-files-found: error
          retention-days: 14
      - name: Summarize coverage
        run: |
          python3 scripts/coverage_summary.py \
            "${{ matrix.name }}/build-deps/coverage/coverage.xml" \
            --tool "${{ matrix.name }}" > coverage-summary.md
          cat coverage-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Comment coverage on the pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          marker="<!-- coverage-summary -->"
          body=$(printf '%s\n\n%s' "$marker" "$(cat coverage-summary.md)")
          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/${{ github.event.pull_request.number }}/comments" \
            --paginate --jq '.[] | select(.body | startswith("<!-- coverage-summary -->")) | .id' | head -n1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -f body="$body" >/dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/${{ github.event.pull_request.number }}/comments" -f body="$body" >/dev/null
          fi
