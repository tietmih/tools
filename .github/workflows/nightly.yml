name: nightly fuzz

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Build sanitizer binary
        run: |
          cmake -S bitstream-inspector -B build-nightly \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build-nightly --parallel
      - name: Generate seeds
        run: |
          python3 bitstream-inspector/tests/gen_vectors.py \
            --out build-nightly/vectors
      - name: Long mutation fuzz
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1:exitcode=99
        run: |
          python3 bitstream-inspector/tests/fuzz.py \
            --bsinfo build-nightly/bsinfo \
            --vectors build-nightly/vectors \
            --iterations 3000
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: nightly-fuzz-failures
          path: build-nightly/vectors/bs-fuzz-*
          if-no-files-found: ignore
          retention-days: 14
