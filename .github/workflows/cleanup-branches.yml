name: cleanup branches

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    name: delete merged ci/* branches
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Delete merged work branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          for branch in $(git for-each-ref \
              --format='%(refname:strip=3)' 'refs/remotes/origin/ci/*'); do
            if git merge-base --is-ancestor "origin/$branch" origin/main; then
              echo "deleting merged branch $branch"
              gh api -X DELETE \
                "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
            fi
          done
